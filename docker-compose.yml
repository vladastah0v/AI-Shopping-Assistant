name: ai-shopping-assistant

x-app-service: &app-service
  image: ai-shopping-assistant:local
  pull_policy: never
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-app-environment: &app-environment
  SHOPPING_POSTGRES_HOST: postgres
  SHOPPING_POSTGRES_DB: shopping_assistant
  SHOPPING_REDIS_URL: redis://redis:6379/0
  SHOPPING_DEPENDENCY_TIMEOUT_SECONDS: ${SHOPPING_DEPENDENCY_TIMEOUT_SECONDS:-2}

services:
  api:
    <<: *app-service
    build: .
    environment:
      <<: *app-environment
      SHOPPING_OLLAMA_ENABLED: ${SHOPPING_OLLAMA_ENABLED:-false}
      SHOPPING_OLLAMA_URL: ${SHOPPING_OLLAMA_URL:-http://host.docker.internal:11434}
      SHOPPING_OLLAMA_MODEL: ${SHOPPING_OLLAMA_MODEL:-qwen2.5:1.5b}
      SHOPPING_OLLAMA_CONNECTION_TIMEOUT_SECONDS: ${SHOPPING_OLLAMA_CONNECTION_TIMEOUT_SECONDS:-2}
      SHOPPING_OLLAMA_GENERATION_TIMEOUT_SECONDS: ${SHOPPING_OLLAMA_GENERATION_TIMEOUT_SECONDS:-45}
      SHOPPING_OLLAMA_RETRIES: ${SHOPPING_OLLAMA_RETRIES:-1}
      SHOPPING_OLLAMA_CONCURRENCY: ${SHOPPING_OLLAMA_CONCURRENCY:-1}
      SHOPPING_OLLAMA_TEMPERATURE: ${SHOPPING_OLLAMA_TEMPERATURE:-0.1}
      SHOPPING_OLLAMA_MAX_TOKENS: ${SHOPPING_OLLAMA_MAX_TOKENS:-512}
      SHOPPING_OLLAMA_CONTEXT_TOKENS: ${SHOPPING_OLLAMA_CONTEXT_TOKENS:-4096}
      SHOPPING_CHAT_SESSION_TTL_SECONDS: ${SHOPPING_CHAT_SESSION_TTL_SECONDS:-86400}
      SHOPPING_CHAT_HISTORY_LIMIT: ${SHOPPING_CHAT_HISTORY_LIMIT:-12}
      SHOPPING_POSTGRES_USER: shopping_app
      SHOPPING_POSTGRES_PASSWORD: ${SHOPPING_POSTGRES_PASSWORD:?Set SHOPPING_POSTGRES_PASSWORD in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=3).close()"]
      interval: 5s
      timeout: 4s
      retries: 5
      start_period: 5s

  migrate:
    <<: *app-service
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *app-environment
      SHOPPING_POSTGRES_USER: shopping_migrator
      SHOPPING_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy

  embeddings:
    <<: *app-service
    profiles: [embeddings]
    image: ai-shopping-assistant-embeddings:local
    build:
      context: .
      target: embeddings
    command: ["python", "-m", "scripts.generate_embeddings"]
    environment:
      <<: *app-environment
      SHOPPING_POSTGRES_USER: shopping_migrator
      SHOPPING_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - embedding_models:/var/cache/huggingface
    tmpfs:
      - /tmp

  postgres:
    image: pgvector/pgvector:0.8.7-pg16-bookworm
    environment:
      POSTGRES_DB: shopping_assistant
      POSTGRES_USER: shopping_migrator
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SHOPPING_POSTGRES_PASSWORD: ${SHOPPING_POSTGRES_PASSWORD:?Set SHOPPING_POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/01-create-app-role.sh:/docker-entrypoint-initdb.d/01-create-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7.4-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  embedding_models:
